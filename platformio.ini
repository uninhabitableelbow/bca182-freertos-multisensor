; PlatformIO project configuration - BCA182 Laboratory Activity 1
; STM32Cube HAL with its bundled native FreeRTOS kernel.
; The framework is EXPLICITLY stm32cube (Arduino framework is not permitted
; for this laboratory).
[platformio]
default_envs = bluepill_wokwi

[env:bluepill_f103c8]
platform = ststm32@20.0.0
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
extra_scripts = pre:scripts/freertos.py
; Physical hardware: standard preemptive Cortex-M3 port.
custom_freertos_port = native
; Part XIV runs hardware-independent tests on the PC, without uploading firmware.
test_ignore = *
; Part XV: analyze project sources with framework includes available.
check_tool = cppcheck
check_flags = --std=c++11 --platform=unix32 --inline-suppr

[env:bluepill_wokwi]
extends = env:bluepill_f103c8
; Simulation: native FreeRTOS kernel with cooperative Thread-mode switching.
custom_freertos_port = wokwi

[env:native]
platform = native@1.2.1
platform_packages = platformio/toolchain-gccmingw32@1.50100.0
extra_scripts = pre:scripts/native_tests.py
test_framework = unity
test_build_src = no
test_filter =
    test_alarm
    test_navigation
    test_system_state
build_flags = -std=c++11 -Wall -Wextra -Werror -static
