; PlatformIO project configuration - BCA182 Laboratory Activity 1
; STM32Cube HAL with its bundled native FreeRTOS kernel.
; The framework is EXPLICITLY stm32cube (Arduino framework is not permitted
; for this laboratory).
[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32@20.0.0
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
extra_scripts = pre:scripts/freertos.py
; Wokwi's NVIC probe retains low bits that the STM32F103 does not implement.
; Disable this option for an unmodified hardware priority-width probe.
custom_wokwi_nvic_workaround = yes
